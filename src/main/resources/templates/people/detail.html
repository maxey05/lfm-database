<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

      th:replace="~{layout :: page('Person', ~{::main})}">
<body>
<main>
    <div class="page-head">
        <h1 th:text="${person.completeName}">Person</h1>

    </div>
</main>
</body>
</html>
