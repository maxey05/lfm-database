<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="table" id="people-table">

    <p class="empty" th:if="${peoplePage.empty}">No records match.</p>

    <table th:unless="${peoplePage.empty}">
        <thead>
            <tr>
                <th><button type="button" class="sort" data-sort="lastName">Complete Name</button></th>
                <th><button type="button" class="sort" data-sort="email">Email</button></th>
                <th><button type="button" class="sort" data-sort="contactNumber">Contact Number</button></th>
                <th><button type="button" class="sort" data-sort="gender">Gender</button></th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="person : ${peoplePage.content}">
                <tr th:replace="~{people/fragments/row :: row(${person})}"></tr>
            </th:block>
        </tbody>
    </table>

    <nav class="pagination">
        <button type="button" data-page-step="-1"
                th:if="${peoplePage.hasPrevious()}">Previous</button>
        <span th:if="${peoplePage.totalPages gt 0}"
              th:text="'Page ' + ${peoplePage.number + 1} + ' of ' + ${peoplePage.totalPages}">Page</span>
        <button type="button" data-page-step="1"
                th:if="${peoplePage.hasNext()}">Next</button>
        <span class="count" th:text="${peoplePage.totalElements} + ' record(s)'">0 record(s)</span>
    </nav>
</div>
</body>
</html>
