<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf} != null ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf} != null ? ${_csrf.headerName} : ''">
    <title th:text="${title} + ' · LFM Database'">LFM Database</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header class="topbar">
        <a class="brand" th:href="@{/people}">LFM Database</a>
        <div class="session" sec:authorize="isAuthenticated()">
            <span class="who" sec:authentication="name">user</span>
            <span class="role" th:each="authority : ${#authentication.authorities}"
                  th:text="${#strings.replace(authority.authority, 'ROLE_', '')}">ROLE</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Sign out</button>
            </form>
        </div>
    </header>

    <main th:replace="${content}">
        <p>Page content goes here.</p>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script th:src="@{/webjars/htmx.org/2.0.3/dist/htmx.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
