spring:
  application:
    name: lfm-database
  datasource:
    url: jdbc:postgresql://localhost:5432/lfm
    username: lfm
    password: lfm
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.flywaydb: INFO