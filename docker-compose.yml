services:
  postgres:
    image: postgres:16
    container_name: lfm-postgres
    environment:
      POSTGRES_DB: lfm
      POSTGRES_USER: lfm
      POSTGRES_PASSWORD: lfm
    ports:
      - "5432:5432"
    volumes:
      - lfm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfm -d lfm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lfm-pgdata: